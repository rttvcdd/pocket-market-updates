<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Market</title>
<style>
:root{--bg:#0b0b0d;--surface:#151518;--line:#26262b;--ink:#ececf1;--mute:#85858f;--purple:#8b5cf6;--purple-hi:#a78bfa;--purple-lo:#6d3fe0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(160deg,#0b0b0d 0%,#15101f 45%,#2c1856 100%) fixed,var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--purple-hi);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fade{from{opacity:0}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes nudge{0%,100%{transform:translateX(-2px)}50%{transform:translateX(3px)}}
@keyframes sweep{to{transform:translateX(400%)}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
/* screens */
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(560px 380px at 50% 32%,rgba(139,92,246,.16),transparent 70%)}
.ld{width:min(360px,100%);text-align:center}
.ld h1{animation:breathe 2.2s ease-in-out infinite}
.bar{height:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:26px 0 12px}
.bar i{display:block;position:relative;overflow:hidden;height:100%;width:0;background:linear-gradient(90deg,var(--purple-lo),var(--purple-hi));border-radius:99px;box-shadow:0 0 14px var(--purple)}
.bar i::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:sweep 1.1s linear infinite}
.ldrow{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.box{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.box>h1,.box>#sub,.box>.seg,.box>#fields,.box>#err,.box>.swipe{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.box>#sub{animation-delay:.06s}.box>.seg{animation-delay:.12s}.box>#fields{animation-delay:.18s}.box>#err{animation-delay:.24s}.box>.swipe{animation-delay:.3s}
.box h1{text-align:center;margin:0}
#sub{margin:-8px 0 4px;text-align:center;color:var(--mute);font-size:14px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surface)}
.pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:linear-gradient(135deg,var(--purple-lo),var(--purple));border-radius:9px;box-shadow:0 0 16px rgba(139,92,246,.4);transition:transform .45s cubic-bezier(.65,0,.25,1)}
.seg[data-m="in"] .pill{transform:translateX(100%)}
.seg button{position:relative;border:0;background:transparent;color:var(--mute);padding:9px;transition:color .3s}
.seg button[aria-pressed="true"]{color:#fff}
#fields{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}
input{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit;transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,92,246,.2)}
#fel{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s cubic-bezier(.65,0,.25,1),opacity .35s,margin .45s cubic-bezier(.65,0,.25,1)}
#fel>div{overflow:hidden;min-height:0;padding:0 3px;margin:0 -3px}
#fel[data-off]{grid-template-rows:0fr;opacity:0;margin-top:-14px}
#err{margin:0;min-height:20px;color:var(--purple-hi);font-size:14px}
/* swipe bar */
.swipe{--x:0px;--p:0;position:relative;height:58px;border:1px solid var(--line);background:linear-gradient(180deg,#101013,var(--surface));border-radius:99px;overflow:hidden;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 8px rgba(0,0,0,.5);transition:border-color .3s}
.swipe:hover,.swipe.drag{border-color:var(--purple)}
.swipe::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--x) + 54px);background:linear-gradient(90deg,rgba(109,63,224,.55),rgba(167,139,250,.55))}
.lbl{position:relative;padding-left:46px;opacity:calc(1 - var(--p)*1.5)}
#swt{font-size:15px;background:linear-gradient(90deg,var(--mute) 40%,#fff 50%,var(--mute) 60%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.4s linear infinite}
.knob{position:absolute;left:4px;top:4px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--purple-hi),var(--purple-lo));color:#fff;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;box-shadow:0 2px 10px rgba(0,0,0,.5),0 0 calc(8px + var(--p)*26px) rgba(139,92,246,.75)}
.swipe.drag .knob{cursor:grabbing}
.knob svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.swipe:not(.drag):not(.ok) .ar{animation:nudge 1.5s ease-in-out infinite}
.ck{display:none}
.swipe.ok .ar{display:none}.swipe.ok .ck{display:block}
.swipe.ok .lbl{opacity:1}
.swipe.ok #swt{animation:none;color:#fff;-webkit-text-fill-color:#fff}
/* shop */
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px}
#app:not([hidden]){animation:fade .6s both}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:24px;font-weight:600;margin:0}
.bal{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600;flex-wrap:wrap}
.bal #bal{display:inline-block}
.bal span.u{color:var(--mute);font-weight:400;font-size:14px;margin-left:-6px}
#who{margin-left:0!important}
.bal button{border:1px solid var(--purple);background:transparent;color:var(--purple-hi);border-radius:8px;padding:6px 12px;font-size:14px;transition:background .2s,color .2s,transform .15s}
.bal button:hover{background:var(--purple);color:#fff}
.bal button:active,.btn:active,.pack:active{transform:scale(.96)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
nav button{background:none;border:0;color:var(--mute);padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .2s,border-color .2s}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--purple)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chips button{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:8px;padding:4px 12px;font-size:14px;transition:all .2s}
.chips button:hover{color:var(--ink)}
.chips button[aria-pressed="true"]{border-color:var(--purple);color:var(--purple-hi)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px;transition:border-color .25s,transform .25s,box-shadow .25s}
.card:hover{border-color:var(--purple);transform:translateY(-3px);box-shadow:0 8px 24px rgba(139,92,246,.15)}
.card small{color:var(--purple-hi);font-size:13px}
.card h3{margin:0;font-size:17px;font-weight:600}
.card p{margin:0;color:var(--mute);font-size:14px;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.price{font-weight:600}
.btn{border:0;border-radius:8px;background:var(--purple);color:#fff;padding:7px 16px;transition:background .2s,transform .15s}
.btn:hover{background:var(--purple-hi)}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--mute)}
.owned{color:var(--purple-hi);font-size:14px}
.packs{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px;padding:14px 16px;background:var(--surface);border:1px solid var(--purple);border-radius:10px;animation:rise .35s both}
.packs p{margin:0;flex:1 1 100%;color:var(--mute);font-size:14px}
.pack{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 16px;transition:border-color .2s,transform .15s}
.pack:hover{border-color:var(--purple)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.list li{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.list li:last-child{border:0}
.list time{color:var(--mute);font-size:13px}
.plus{color:var(--purple-hi)}
.empty{padding:32px 16px;text-align:center;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--purple);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:28px;color:var(--mute);font-size:13px}
/* library layout */
header h1{font-size:15px;font-weight:600}
nav{justify-content:center;overflow:visible;margin:0;padding:4px;gap:2px;background:rgba(21,21,24,.72);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px)}
nav button{margin:0;border:0;border-radius:10px;padding:6px 18px}
nav button[aria-selected="true"]{background:rgba(139,92,246,.24);color:#fff;border:0}
.pt{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:8px 0 4px}
.ps{margin:0 0 24px;color:var(--mute)}
.pt2{font-size:20px;font-weight:600;margin:30px 0 12px}
.sbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(21,21,24,.6);color:var(--mute)}
.sbar input{flex:1;min-width:140px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 4px;box-shadow:none}
.sbar input:focus{border-bottom-color:var(--purple);box-shadow:none}
.sbar select{min-width:150px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.go{background:#3a3a40;color:#fff;border:0;border-radius:10px;padding:10px 24px;transition:background .2s}
.go:hover{background:var(--purple)}
.car{position:relative}
.strip{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:6px 52px}
.strip::-webkit-scrollbar{display:none}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:56px;border:1px solid var(--line);background:rgba(11,11,13,.88);color:var(--ink);border-radius:10px;font-size:22px;z-index:2;transition:border-color .2s}
.arr.l{left:0}.arr.r{right:0}.arr:hover{border-color:var(--purple)}
.tile{flex:0 0 min(300px,72%);height:150px;scroll-snap-align:start;position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 50% 30%),hsl(var(--h2) 55% 12%));transition:transform .25s,box-shadow .25s}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(139,92,246,.25)}
.tile .big{position:absolute;right:14px;top:-8px;font-size:110px;font-weight:800;line-height:1;color:rgba(255,255,255,.12)}
.tag{position:absolute;top:10px;left:10px;font-style:normal;font-size:12px;background:rgba(139,92,246,.25);color:var(--purple-hi);border:1px solid rgba(167,139,250,.4);border-radius:6px;padding:1px 8px}
.ti{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.ti h3{margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;justify-content:space-between;align-items:center;color:#b6b6c0;font-size:13px}
.btn.sm{padding:4px 12px;font-size:13px}
.tile.ph{border:1.5px dashed var(--line);background:rgba(21,21,24,.5);display:flex;align-items:center;justify-content:center;color:var(--mute);box-shadow:none;transform:none}
@media (max-width:700px){nav{order:3;width:100%}.pt{font-size:32px}.strip{padding:6px 44px}}
/* library glow and admin */
@keyframes glow{50%{box-shadow:0 0 26px rgba(196,181,253,.9),0 0 70px rgba(139,92,246,.65)}}
.lib{padding:10px}
.lib .tile{box-shadow:0 0 16px rgba(167,139,250,.65),0 0 46px rgba(139,92,246,.45);outline:1px solid rgba(196,181,253,.75);outline-offset:-1px;animation:glow 3s ease-in-out infinite}
.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.subnav button{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:8px;padding:5px 14px;font-size:14px;transition:all .2s}
.subnav button[aria-pressed="true"]{border-color:var(--purple);color:var(--purple-hi)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat,.panel{background:rgba(21,21,24,.8);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.panel{margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:16px}
.stat small{color:var(--mute);display:block}
.stat b{font-size:22px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
.form input[type=checkbox]{width:22px;height:22px;accent-color:var(--purple)}
.list li.empty{justify-content:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="loader" class="screen"><div class="ld"><h1>Pocket Market</h1><div class="bar"><i id="fill"></i></div><div class="ldrow"><span id="ldtxt">Starting up</span><span id="pct">0%</span></div></div></div>
<div id="auth" class="screen" hidden>
<form class="box" id="form" autocomplete="off" novalidate>
<h1>Pocket Market</h1>
<p id="sub">Create an account to start shopping</p>
<div class="seg" id="seg" data-m="up"><span class="pill"></span><button type="button" data-mode="up" aria-pressed="true">Create account</button><button type="button" data-mode="in" aria-pressed="false">Sign in</button></div>
<div id="fields">
<label>Username<input id="fu" autocomplete="off"></label>
<div id="fel"><div><label>Email<input id="fe" type="email" autocomplete="off"></label></div></div>
<label>Password<input id="fp" type="password" autocomplete="off"></label>
</div>
<p id="err" role="alert"></p>
<div class="swipe" id="sw" tabindex="0" role="slider" aria-label="Swipe to continue" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
<span class="lbl" id="lbl"><span id="swt">Swipe to create account</span></span>
<b class="knob" id="kn"><svg class="ar" viewBox="0 0 24 24"><path d="M5 6l6 6-6 6M13 6l6 6-6 6"/></svg><svg class="ck" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></b>
</div>
</form>
</div>
<div class="wrap" id="app" hidden>
  <header>
    <h1>Pocket Market</h1>
    <nav role="tablist" id="tabs">
      <button role="tab" data-tab="store" aria-selected="true">Discover</button>
      <button role="tab" data-tab="lib" aria-selected="false">Library <span id="cnt"></span></button>
      <button role="tab" data-tab="hist" aria-selected="false">History</button>
      <button role="tab" data-tab="admin" aria-selected="false" id="adminTab" hidden>Admin</button>
    </nav>
    <div class="bal" aria-live="polite"><span id="bal">0</span><span class="u">credits</span><button id="topBtn">Add credits</button><span id="who" class="u"></span><button id="out">Sign out</button></div>
  </header>
  <main id="view"></main>
  <p class="foot">Demo shop: credits are virtual and no real payments are taken. Your balance and library are saved on this device.</p>
</div>
<div id="toast" role="status"></div>
<script>
/* Add your items here, one per line, for example:
   {id:1,n:"Item name",c:"Category",p:25,d:"Short description.",f:true} (f:true shows an item under Featured) */
let ITEMS=[];try{ITEMS=JSON.parse(localStorage.getItem("pm-items")||"[]")}catch(e){}
const PACKS=[50,120,300];
let KEY="";
let S={credits:100,owned:[],hist:[]};
function loadState(){S={credits:100,owned:[],hist:[{t:Date.now(),x:"Welcome bonus",d:100}]};try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}}
let tab="store",cat="All",showTop=false;
const $=s=>document.querySelector(s);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200)}
function buy(id){
  const it=ITEMS.find(i=>i.id===id);
  if(S.owned.includes(id))return;
  if(S.credits<it.p){showTop=true;tab="store";render();toast("Not enough credits. Add "+(it.p-S.credits)+" more to buy this.");return}
  S.credits-=it.p;S.owned.push(id);logSale(it);S.hist.unshift({t:Date.now(),x:"Bought "+it.n,d:-it.p});save();render();toast("Bought “"+it.n+"”");
}
function topUp(c){S.credits+=c;S.hist.unshift({t:Date.now(),x:"Added credits (demo)",d:c});save();showTop=false;render();toast(c+" credits added")}
let q="";
function tile(it){
  const own=S.owned.includes(it.id),short=S.credits<it.p,h=255+(it.id*37)%45;
  return `<article class="tile" style="--h:${h};--h2:${h+25}${okImg(it.img)?`;background-image:linear-gradient(transparent 40%,rgba(0,0,0,.4)),url('${okImg(it.img)}');background-size:cover;background-position:center`:""}">${okImg(it.img)?"":`<span class="big" aria-hidden="true">${esc(it.n[0])}</span>`}<em class="tag">${own?"Owned":esc(it.c)}</em><div class="ti"><h3>${esc(it.n)}</h3><div class="tr"><span>${it.p} credits</span>${own?"":`<button class="btn sm ${short?"alt":""}" data-buy="${it.id}">${short?"Need "+(it.p-S.credits):"Buy"}</button>`}</div></div></article>`;
}
function row(title,list){return `<section><h2 class="pt2">${title}</h2><div class="car"><button class="arr l" data-sc="-1" aria-label="Scroll left">‹</button><div class="strip">${list.length?list.map(tile).join(""):[0,1,2,3].map(()=>`<div class="tile ph"><span>Empty slot</span></div>`).join("")}</div><button class="arr r" data-sc="1" aria-label="Scroll right">›</button></div></section>`}
function resHTML(){
  const ql=q.toLowerCase(),f=ITEMS.filter(i=>(cat==="All"||i.c===cat)&&(i.n+" "+i.c+" "+i.d).toLowerCase().includes(ql));
  if(q||cat!=="All")return f.length?`<div class="grid" style="margin-top:20px">${f.map(tile).join("")}</div>`:`<div class="empty">No items match your search.</div>`;
  const ft=ITEMS.filter(i=>i.f);
  return row("Featured",ft.length?ft:ITEMS.slice(0,10))+row("New arrivals",[...ITEMS].reverse().slice(0,10));
}
function discover(){
  const cats=[...new Set(ITEMS.map(i=>i.c))];
  return `<h2 class="pt">Discover</h2><p class="ps">Search, browse and buy items with credits</p><div class="sbar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Search items by name or category" value="${q.replace(/"/g,"&quot;")}"><select id="cs"><option value="All">All items</option>${cats.map(c=>`<option value="${esc(c)}" ${c===cat?"selected":""}>${esc(c)}</option>`).join("")}</select><button class="go" data-go="1">Search</button></div><div id="res">${resHTML()}</div>`;
}
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;$("#res").innerHTML=resHTML()}});
document.addEventListener("change",e=>{if(e.target.id==="cs"){cat=e.target.value;$("#res").innerHTML=resHTML()}});
function fmt(t){return new Date(t).toLocaleString([],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function render(){
  const b=$("#bal");
  if(b.textContent!=S.credits){b.textContent=S.credits;b.animate([{transform:"scale(1.4)",color:"#a78bfa"},{transform:"scale(1)"}],{duration:450,easing:"ease-out"})}
  $("#cnt").textContent=S.owned.length?"("+S.owned.length+")":"";
  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===tab));
  let h="";
  if(tab==="store"){
    if(showTop)h+=`<section class="packs"><p>Add credits. This is a demo, so they are free.</p>${PACKS.map(c=>`<button class="pack" data-top="${c}">${c} credits</button>`).join("")}</section>`;
    h+=discover();
  }else if(tab==="lib"){
    const mine=ITEMS.filter(i=>S.owned.includes(i.id));
    h=`<h2 class="pt">Library</h2><p class="ps">Everything you own</p>`+(mine.length?`<div class="grid lib">${mine.map(tile).join("")}</div>`:`<div class="empty">Your library is empty. Buy an item in Discover and it will appear here.</div>`);
  }else if(tab==="admin"){adminRender();return}else{
